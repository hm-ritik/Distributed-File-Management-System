   services:
     redis:
       image: redis:7-alpine
       healthcheck:
         test: ["CMD", "redis-cli", "ping"]
         interval: 5s
         timeout: 3s
         retries: 5

     backend:
       build: ./backend
       env_file: ./backend/.env
       environment:
         REDIS_URL: redis://redis:6379
       ports:
         - "8000:8000"
       depends_on:
         redis:
           condition: service_healthy

     frontend:
       build: ./frontend
       ports:
         - "8080:80"
       depends_on:
         - backend